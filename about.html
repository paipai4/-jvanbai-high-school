<h1>卷摆高中（PaiSchool）</h1>
<p>原创教室题材双人对抗游戏的 RTT 移植版。地图为高三十班教室：讲台、6 列 × 5 排共 30 张课桌（每桌 3 格座位，合计 90 个控制点）、学霸区 / 普通区 / 松弛区三种区域，以及顶部 -4（摆烂）～ +4（内卷）的班级氛围轨道。</p>
<p>玩家 A「成绩派」与玩家 B「快乐派」轮流占领座位控制点，争夺班级话语权。</p>
<p>当前版本为模块基础框架：已实现地图加载与控制点绑定，规则引擎待扩展。</p>
